# The topic consolidation, as data (ADR-003).
#
# `research.yaml` accumulated 172 distinct topic strings across 119 papers,
# most of them used once. This file is the mapping from those strings onto the
# controlled vocabulary the record enforces.
#
# Two vocabularies, because the two schemes cover different ground:
#
#   * SOTA gets the seven categories the 2024 naming-conventions document
#     specified and nothing ever applied. `registry_topics` below is that
#     document's own "previously covered by" table, transcribed.
#
#   * LIT gets those seven plus five the reading list needs and the practice
#     registry never did — the corpus carries substantial generative, vision
#     and inference work that produced no training recommendation.
#
# `weights` drives the scoring: a paper's first topic counts triple, the rest
# count once, and the winning category takes the document's primary tag. The
# scoring is a labour-saving device, not an authority — where it read a paper
# wrong, `overrides` says so by arXiv id, with the reason.

# ─────────────────────────────────────────────────────────────────────────
# SOTA: the seven. Transcribed from the naming-conventions document's
# "previously covered by" lists, which is why the left-hand side is the 22
# topics the registry actually used rather than the full 172.
# ─────────────────────────────────────────────────────────────────────────
registry_topics:
  optimization: training-optimization
  training-efficiency: training-optimization
  training-dynamics: training-optimization
  large-batch-training: training-optimization
  scaling-laws: training-optimization

  hardware-optimization: systems-optimization
  compilation: systems-optimization
  systems: systems-optimization

  training-stability: model-stability
  initialization: model-stability
  normalization: model-stability

  distributed-training: distributed-optimization
  memory-efficiency: distributed-optimization
  checkpointing: distributed-optimization

  data-loading: data-pipeline
  data-quality: data-pipeline

  attention: attention-techniques
  attention-alternatives: attention-techniques

  transformers: model-architecture
  nlp: model-architecture
  MoE: model-architecture
  # Not in the naming document's table — it postdates it. A language model is
  # an architecture claim before it is anything else.
  language-models: model-architecture

