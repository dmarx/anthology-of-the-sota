# src/scripts/repo_features/repos.yaml
#
# What to read, and how. `ref` is what gets resolved to a SHA each run; pin it
# to a tag or a SHA to freeze a repository, leave it `HEAD` to track.
#
# `kind` is the thing #183 turns on and must not be guessed per-repo at read
# time. An `adoption` repository implements a technique because people use it,
# so its contents are evidence about `consensus`. A `catalogue` repository
# implements one because somebody found it interesting, so its contents are a
# reading list. Confusing them is how 62 unadopted architecture variants get
# filed as practice candidates.
#
# `mlfoundations/open_clip` was read once for #290 and is deliberately absent.
# Nine of the fifteen identifiers its README holds are checkpoint rows or
# dataset cards, and the `arxiv` extractor cannot tell those from a technique:
# the file is a model roster with a bibliography, which is a third kind of
# index and not one #183 has a reading for. The pass harvested what it had
# — `2103.00020`, `2109.01903`, `2303.15343`, `2212.00794` — and a roster is
# worth a person's eye once, not a scrape every run, because every new
# checkpoint grows it and none of the growth is a technique.
repos:
  vllm:
    repo: vllm-project/vllm
    kind: adoption
    ref: HEAD
    files:
      docs/features/README.md: table:0
      docs/features/quantization/README.md: table:0
  diffusers:
    repo: huggingface/diffusers
    kind: adoption
    ref: HEAD
    files:
      src/diffusers/schedulers/__init__.py: exports:Scheduler
  transformers:
    repo: huggingface/transformers
    kind: adoption
    ref: HEAD
    files:
      # The quantization overview's support matrix. Chosen because it is the
      # one place `transformers` enumerates techniques rather than models —
      # its doc tree is navigation, and its model list is 300+ architectures,
      # which is a different question than #183 is asking.
      docs/source/en/quantization/overview.md: table:0
  x-transformers:
    repo: lucidrains/x-transformers
    kind: catalogue
    ref: HEAD
    files:
      README.md: arxiv
  k-diffusion:
    repo: crowsonkb/k-diffusion
    kind: catalogue
    ref: HEAD
    files:
      README.md: arxiv
  captum:
    repo: meta-pytorch/captum
    kind: catalogue
    ref: HEAD
    files:
      # `References of Algorithms` is the cleanest index of the four read for
      # #290 — one line per public class, naming the paper it implements. It
      # is a catalogue and not an adoption index despite being Meta's
      # production library: the same README links `1810.03292` and
      # `2106.07475`, both of which examine methods it ships anyway. A list
      # that carries its own critiques is enumerating a literature, not
      # reporting a convergence.
      README.md: arxiv
