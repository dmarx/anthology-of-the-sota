# ─────────────────────────────────────────────────────────────────────────
# Where the scoring read a paper wrong. Each of these was checked by hand.
# ─────────────────────────────────────────────────────────────────────────
overrides:
  '1712.09913': # Visualizing the Loss Landscape of Neural Nets
    tag: analysis-and-evaluation
    why: An analysis method, not an optimizer. Its topics lead with
         `optimization` because that is what it analyses.
  '1803.03635': # The Lottery Ticket Hypothesis
    tag: analysis-and-evaluation
    why: A hypothesis about initialization, not a pruning recipe — the
         pruning is the instrument.
  '2110.13016': # Understanding Multi-View Representation Learning
    tag: analysis-and-evaluation
    why: Atticked as theory without concrete recommendations; the status
         and the tag should agree about that.
  '2301.05217': # Progress measures for grokking
    tag: analysis-and-evaluation
    why: Measurement of training dynamics rather than a technique for them.
  '2005.14165': # Language Models are Few-Shot Learners (GPT-3)
    tag: model-architecture
    why: Scored into adaptation-and-tuning on `few-shot-learning`, but the
         paper's claim is about scale and architecture.
  '2205.05131': # Scale Efficiently (pre-training and fine-tuning transformers)
    tag: training-optimization
    why: Scored into adaptation-and-tuning on `fine-tuning`; the finding is
         about how scaling interacts with training.
  '2212.08073': # Constitutional AI
    tag: adaptation-and-tuning
    why: Post-training alignment. The only paper here on the subject, and
         it belongs with the tuning work rather than under analysis.
