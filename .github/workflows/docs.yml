# The record's own CI, in the recommended shape (LU-ADR-029, LU-ADR-068).
# Four jobs, split by event because views and repairs belong in different
# places:
#
#   docs-generate  PUSH ONLY. Regenerates the derived views (index, tag
#                  pages, books, README badges, reference links) and commits
#                  them back as the bot — derived documentation is built, not
#                  maintained, and a view a human has to rebuild by hand will
#                  drift. The README used to be assembled from templates in
#                  this job as well; it is now an ordinary file with one
#                  luria-managed region inside it.
#   docs-lint      PUSH ONLY. Gates what a generator cannot decide:
#                  unresolved references, wikilinks that resolve to nothing,
#                  a title disagreeing with its heading, stray files in a
#                  view directory. It `needs:` docs-generate and reads the
#                  SHA it output — a push made with GITHUB_TOKEN does not
#                  retrigger workflows, so a lint anywhere else would keep a
#                  red earned from the pre-regeneration commit and never
#                  clear it.
#   docs-check     PULL REQUEST ONLY. Repairs the sources, pushes the repair
#                  onto the branch, and lints the sources in the same job —
#                  `views: "false"`, so no view is written here.
#   collect        assembles changelog fragments on a cadence, never
#                  per-merge (LU-ADR-002 — a per-merge bot commit races
#                  in-flight rebases, reintroducing the conflict fragments
#                  exist to remove).
#
# Why the split, which is the whole point of this file's shape: a view is a
# file EVERY branch rewrites. Generating them on pull requests meant every
# concurrent branch regenerated the same index, tag page and book, so any two
# branches conflicted on files neither had edited — and a stacked branch hit
# the conflict again after each merge, because the bot's regeneration commit
# on main is another rewrite of the same shared files. A source repair is the
# opposite: it touches only what the branch itself authored, so it belongs on
# the branch where the review reads it. Views on the default branch only,
# repairs on the branch that authored them (LU-ADR-068).
#
# The staleness check inside `luria lint` stays meaningful with generation
# automated: on a push it catches a generator that didn't run or couldn't
# push. On a pull request the lint runs in the same job as the repair and
# reads sources, so a branch carrying no view is not stale — it is correct.
#
# One caution for maintainers, and it is stricter than this file used to say:
# GitHub skips a workflow run when the head commit message carries its skip
# marker ANYWHERE, in any of its five spellings — not merely in the first or
# last line, which is what the documentation says and what this comment
# claimed until a commit carrying it on line 18 of 56 silently started no run
# at all. So a commit message *describing* the bot's commit format suppresses
# its own CI, with no error and no skipped-run entry to notice. Name the
# marker in prose, never quote it verbatim, and be aware that a pasted CI log
# is the likeliest way to quote it by accident. File contents like this one
# are unaffected.
name: Docs

# Runs for one ref serialize. Merging several pull requests in quick
# succession starts one push run per merge, and every one of them regenerates
# the same views and pushes them to the same branch — so the ones that lose
# the race pull, rebase their own regeneration commit onto the winner's, and
# conflict on the files both just rewrote. Four merges in forty seconds took
# down four runs that way, and the concretization one of them had already
# performed was lost with it, leaving temporary codes on `main` that the
# trunk guard is there to forbid.
#
# `cancel-in-progress: false` queues rather than cancels: a run that is
# already committing gets to finish. GitHub keeps at most one *pending* run
# per group, so a burst of merges collapses to "the run in flight, then one
# more" — and that last run regenerates from the final source state and
# concretizes everything still outstanding, which is the only outcome that
# has to be correct.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly collection. Adjust to taste; the only wrong answer is "every merge".
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  docs-generate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.generate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: generate
        uses: dmarx/luria/actions/generate@0.12.0
        with:
          pip-spec: luria==0.13.0
          # Assign real numbers to merge-allocated temporary codes
          # (LU-ADR-049) — only where merges serialize, which is this job.
          # Concretizing on a branch is the premature number claim the
          # temporary codes exist to avoid.
          concretize: "true"
          views: "true"

  docs-lint:
    if: github.event_name == 'push'
    needs: docs-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docs-generate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dmarx/luria/actions/lint@0.12.0
        with:
          pip-spec: luria==0.13.0

  # The pull-request shape: repair the sources, push the repair onto the
  # branch, and lint the sources in the same job. No view is written, so two
  # branches cannot conflict on one — and the lint needs none, because it
  # reads sources rather than checking a view it just declined to build.
  docs-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Same-repo PR: the head branch, so a repair has somewhere to land.
          # Fork PR: that branch only exists in the fork — naming it fails the
          # checkout before any push guard runs — so fall back to the default
          # merge-commit checkout (empty ref); the action warns instead of
          # pushing.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dmarx/luria/actions/generate@0.12.0
        with:
          pip-spec: luria==0.13.0
          views: "false"
      - uses: dmarx/luria/actions/lint@0.12.0
        with:
          pip-spec: ""

  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install luria==0.13.0
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: luria collect --commit
      - run: git push
