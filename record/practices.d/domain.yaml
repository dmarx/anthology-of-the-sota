# What a practice is known to APPLY to — which is a different question from
# what kind of claim it makes, and the reason this is its own axis rather
# than more entries in tags.yaml.
#
# `primary_topic` is `exactly-one` and it is the browsing axis. A topic spent
# naming the domain is a topic not spent naming the claim: a diffusion
# preconditioning practice filed under a `generative-modeling` topic renders
# on the generative page and NOT beside the normalization practices it is a
# sibling of, which is the opposite of what this record is for. Held apart,
# the same practice is `training-optimization` + `domain: generative-modeling`
# and lands where someone would trip over it.
#
# `domain-general` is the value that earns the axis. "What transfers?" is the
# question a practitioner in another modality actually has, and before this
# field the record could not answer it — every practice looked equally like
# an LLM practice, including the ones that are not.
#
# `unassessed` is the default and most of the corpus carries it. A domain
# reading is a judgement about where evidence exists, it needs grounds, and a
# value invented to fill a column is worse than an admission.
#
# A LIST, unlike `consensus:`, because the two facts have different shapes.
# Consensus is a scalar: one position on one axis. This is a set — the
# domains where the practice has been shown to hold — and it accumulates as
# evidence arrives. LoRA is established in language modelling and in
# diffusion; naming one underclaims and `domain-general` overclaims, and only
# a list says the true thing.
#
# Two values do not combine with others, and the lint cannot say so:
#
#   `unassessed` means nobody has looked. Pairing it with a domain contradicts
#   itself — if you knew one, you looked.
#   `domain-general` is a claim of a different KIND from the rest. The others
#   report where evidence exists; this one says the mechanism does not depend
#   on modality at all. It is not the union of the list and cannot be reached
#   by enumerating it — nobody tested Adam in six fields, it just does not
#   care what the gradients came from. Listed alone, or not at all.

unassessed:
  label: Not judged
  blurb: nobody has established what this applies to; the default, and true
    of most of the corpus

domain-general:
  label: Transfers
  blurb: holds across modality and objective — the practices anyone can take,
    whatever they are training

language-modeling:
  label: Language models
  blurb: autoregressive text, and the record's acknowledged bias

vision:
  label: Vision
  blurb: image and video understanding, dense prediction, 3D reconstruction

generative-modeling:
  label: Generative models
  blurb: diffusion, flow and consistency models for images, video and audio

multimodal:
  label: Multimodal
  blurb: vision-language and audio-language models, where the claim is about
    the join rather than either side
