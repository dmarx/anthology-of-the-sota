name: Convert Logo SVG to PNG

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'assets/logo.svg'  # Only run when logo changes

# This job pushes to the ref it ran on, so it is a writer to shared state and
# ADR-019 asks it to say how it serializes. Per ref, and never cancelled: a
# cancelled run leaves the PNG unregenerated while the SVG that triggered it
# is already on the branch, which is the state this exists to prevent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    # Stated rather than inherited from the default token. The audit ADR-019
    # describes lists the jobs holding `contents: write` — which is exactly
    # why that audit missed this file: it pushed on an implicit grant, so
    # there was no line to find.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Inkscape
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y inkscape
      
      - name: Convert SVG to PNG
        run: |
          mkdir -p assets
          inkscape --export-type=png --export-filename=assets/logo.png assets/logo.svg
      
      - name: Commit PNG if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/logo.png
          git diff --quiet && git diff --staged --quiet || git commit -m "Update logo.png from SVG source [skip ci]"
          git push
