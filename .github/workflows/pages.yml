# Publish the record as a browsable site on GitHub Pages (LU-ADR-042).
#
# `luria site` stages every page the record publishes — the decisions, the
# principles document, the devlog books, the reports — with paths preserved,
# so the relative links `luria link --fix` already wrote keep resolving. The
# composite action builds that vault with a pinned Quartz, which gives the
# citations a graph and backlinks without anyone maintaining either.
#
# Before the first deploy succeeds, set Settings → Pages → Source to
# "GitHub Actions". That is a repository setting; no file in the repository
# can turn it on, and until it is on the `deploy` job fails with "Pages is
# not enabled" while `build` stays green.
#
# The site is built from the committed views, so it builds AFTER the job that
# commits them. `workflow_run` fires when Docs completes on `main`, by which
# time its generation job has pushed the regenerated views and concretized any
# merge-allocated codes, and the checkout is the head of `main`.
#
# It used to trigger on `push: [main]` alongside Docs, which meant the two
# raced and Pages always won: it built the merge commit's tree, and Docs then
# rewrote it. Harmless for a view whose content did not change, and not
# harmless at all for a concretization, which RENAMES record files — five
# documents merged in #33 were absent from the published site until an
# unrelated later push happened to trigger Pages again. If you rename the Docs
# workflow, rename it here too.
#
# Publishing is gated on `main`, and deliberately more narrowly than the
# repository is configured to allow: the `github-pages` environment also
# permits deployment from `claude/*` branches, kept for the day a branch has
# to publish a preview. Until that day the workflow declines the permission
# rather than spending it. `workflow_run` already filters `branches: [main]`;
# `deploy` checks the branch a SECOND time, because `workflow_dispatch` takes
# no branch filter at all and a dispatch from a branch would otherwise publish
# that branch's tree over the site.
#
# `build` is not gated, and the asymmetry is the point. A `workflow_dispatch`
# from any branch still proves the site builds — which is what the
# `pull_request` trigger did automatically until it was removed here, now that
# `docs-check` covers pull-request correctness on its own. Restoring it costs
# one line (`pull_request:` under `on:`) and nothing else, because `deploy` now
# refuses a branch on its own terms instead of by trusting the event name.
#
# Delete this file if you would rather not publish. Nothing else depends on
# it — `luria site` is a build step, and the record it reads is the record
# every other command reads.
name: Pages

on:
  workflow_run:
    workflows: [Docs]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A Docs run that failed has no regenerated views worth publishing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: site
        uses: dmarx/luria/actions/site@0.31.0
        with:
          # Was taking the action's default `pip-spec` — bare `luria` — so the
          # site alone floated to whatever release was newest while every other
          # job was pinned. Pinned here so the published site is built by the
          # version the rest of CI verified.
          pip-spec: luria==0.31.0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  # Separate from the build because it is the only job that needs to write —
  # and the only one that must not run off `main`. The condition names the
  # branch rather than excluding an event: the previous `!= 'pull_request'`
  # was a deny-list of one entry, and a `workflow_dispatch` walked straight
  # past it. `workflow_run` reports the triggering run's branch in
  # `head_branch`, not in `github.ref`, so the two events are checked
  # separately.
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
