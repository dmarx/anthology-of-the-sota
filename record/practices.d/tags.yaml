# The categories a practice can carry as its primary topic, in the order the
# index shows them. The first seven are transcribed from the 2024
# naming-conventions document; ADR-003 is where they became binding.
#
# The other six arrived one decision at a time, each because something needed
# filing and the list had no word for it:
#
#   ADR-021  inference-optimization, adaptation-and-tuning -- it found
#            thirteen practices about serving and adaptation scattered
#            across the original seven because neither subject had a word
#   #114     representation-and-encoding
#   ADR-027  analysis-and-evaluation
#   ADR-026  generative-modeling, vision-and-graphics
#
# Every one of those words was already in the LIT scheme, which has carried
# them since ADR-003. Since ADR-026 the two lists are THE SAME THIRTEEN:
# neither vocabulary has a word the other lacks, and nothing here is LIT-only.
# The schemes differ in what a document IS, not in what it may be ABOUT.
#
# `luria.toml` holds the *rule* (exactly one of these per practice); this file
# holds what each one means. A tag used here but not listed still renders,
# alphabetically and without a blurb — adding one needs no code change.

training-optimization:
  label: Training optimization
  blurb: learning-rate schedules, batch size, optimizers, training dynamics,
    scaling strategies

systems-optimization:
  label: Systems optimization
  blurb: hardware utilization, kernels, compilation, memory access patterns

model-stability:
  label: Model stability
  blurb: initialization, normalization, gradient handling, loss-landscape
    behaviour

distributed-optimization:
  label: Distributed optimization
  blurb: distribution strategies, memory management, checkpointing,
    communication

data-pipeline:
  label: Data pipeline
  blurb: loading, quality assessment, preprocessing, batch preparation

attention-techniques:
  label: Attention techniques
  blurb: attention variants, implementation optimizations, alternative
    mechanisms

model-architecture:
  label: Model architecture
  blurb: architecture patterns, component design, structural choices

inference-optimization:
  label: Inference optimization
  blurb: serving-time decisions — batching, cache layout, quantization
    procedure, sampling algorithms

adaptation-and-tuning:
  label: Adaptation and tuning
  blurb: taking a trained model somewhere new — fine-tuning, preference
    training, parameter-efficient adaptation, context extension

representation-and-encoding:
  label: Representation and encoding
  blurb: how the signal is encoded before the expensive network sees it —
    tokenizers and learned latents, positional encoding, and the frequency or
    basis choices that go with them

# Added by ADR-027. Narrower than the literature side's topic of the same
# name: there it covers a paper's subject and includes theory and
# interpretability; here it covers an ACTION, so it is about the practitioner's
# measurement rather than about a research programme.
analysis-and-evaluation:
  label: Analysis and evaluation
  blurb: how to find out whether something worked — what to measure, what a
    measurement cannot tell you, and which comparisons are unsound

# Added by ADR-026, which supersedes ADR-020. Both were rejected there on
# a browsing argument the evidence did not bear out, and the rejection was
# being cited as a scope boundary — the exact thing ADR-020 removed. Take a
# domain topic when the claim is ABOUT the domain; a claim merely discovered
# in one still takes its kind.
generative-modeling:
  label: Generative modeling
  blurb: diffusion, samplers, text-to-image, conditioning and control
vision-and-graphics:
  label: Vision and graphics
  blurb: neural rendering, reconstruction, perception, visual foundation
    models
