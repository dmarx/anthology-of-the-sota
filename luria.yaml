# Luria configuration for the Anthology of the SOTA.
#
# The record has four families. Two of them are the anthology itself — `SOTA`
# is the product (one document per recommendation) and `LIT` is the evidence
# (one note per paper) — and two are this project reasoning about itself.
#
# The split between SOTA and LIT is the point of the whole restructure: the
# YAML it replaced kept `attic` and `experimental` as fields on a *paper*,
# while what they actually qualified was a *recommendation*. A paper can be
# foundational and its specific advice stale; a paper can be atticked and a
# practice drawn from it still hold. Two schemes, two status fields, and the
# relationship between them is a citation the lint can follow. See ADR-002.
vocabularies:
  # The thirteen topics: the primary axis of both the practice registry and the
  # reading list, in the order the indexes show them.
  #
  # The first seven are transcribed from the 2024 naming-conventions document;
  # ADR-003 is where they became binding. The other six arrived one decision at
  # a time, each because something needed filing and the list had no word for
  # it:
  #
  #   ADR-021  inference-optimization, adaptation-and-tuning -- it found
  #            thirteen practices about serving and adaptation scattered
  #            across the original seven because neither subject had a word
  #   #114     representation-and-encoding -- closing a gap ADR-021 left, and
  #            fixing a broken invariant: where the two vocabularies name the
  #            same kind of claim they should use the same word, and a paper
  #            about tokenization had nowhere to go
  #   ADR-027  analysis-and-evaluation
  #   ADR-026  generative-modeling, vision-and-graphics
  #
  # Every one of those words was already in the LIT scheme, which has carried
  # them since ADR-003; the practice registry caught up one decision at a time.
  #
  # ONE vocabulary, not two. ADR-026 made the lists identical and said why --
  # the schemes differ in what a document IS, not in what it may be ABOUT --
  # but each scheme kept its own copy of the glosses, and ten of the thirteen
  # drifted apart unnoticed. A blurb answers "what is this about?", which is
  # the shared question; what a document IS is said once, by the scheme.
  #
  # The filing rule is ADR-026's and is the point: take a domain topic when the
  # claim is ABOUT the domain; a claim merely discovered in one still takes its
  # kind. `fields.tags.groups` holds the RULE (exactly one of these per
  # document); this table holds what each one means. A tag used on a document
  # but not listed here still renders, alphabetically and without a blurb --
  # the field is open, so adding a word needs no code change.
  topics:
    training-optimization:
      label: Training optimization
      blurb: optimizers, learning-rate schedules, batch size, training dynamics, scaling laws and scaling strategies
    systems-optimization:
      label: Systems optimization
      blurb: hardware utilization, kernels, compilation, memory access patterns, numerical precision
    model-stability:
      label: Model stability
      blurb: initialization, normalization, gradient handling, regularization, loss-landscape behaviour
    distributed-optimization:
      label: Distributed optimization
      blurb: parallelism and sharding, communication, memory management, checkpointing
    data-pipeline:
      label: Data pipeline
      blurb: loading, quality assessment and selection, preprocessing, batch preparation
    attention-techniques:
      label: Attention techniques
      blurb: attention variants and alternative mechanisms, implementation optimizations, context length
    model-architecture:
      label: Model architecture
      blurb: architecture patterns, component design, structural choices, model families, multi-modal designs
    inference-optimization:
      label: Inference optimization
      blurb: serving-time decisions — batching, cache layout, quantization, compression, sparsity, distillation, sampling algorithms
    adaptation-and-tuning:
      label: Adaptation and tuning
      blurb: taking a trained model somewhere new — fine-tuning and transfer, preference training and alignment, parameter-efficient adaptation, context extension
    representation-and-encoding:
      label: Representation and encoding
      blurb: how the signal is encoded before the expensive network sees it — tokenizers and learned latents, positional encoding, and the frequency or basis choices that go with them
    analysis-and-evaluation:
      label: Analysis and evaluation
      blurb: how to find out whether something worked — what to measure, what a measurement cannot tell you, and which comparisons are unsound; theory, interpretability and debugging belong here too
    generative-modeling:
      label: Generative modeling
      blurb: diffusion, samplers, text-to-image, conditioning and control
    vision-and-graphics:
      label: Vision and graphics
      blurb: neural rendering, reconstruction, perception, visual foundation models
    # ── Secondary-only words ─────────────────────────────────────────────
    # Declared so they have a label and a blurb rather than rendering as bare
    # strings, and so `closed: true` on SOTA, LIT and THEORY can require that
    # every tag those three carry is one somebody chose. NOTE's `tags:` names no
    # vocabulary, so it is not covered. They are NOT in the `primary_topic` group,
    # which is still the thirteen above: a document may carry one of these
    # alongside its topic, never instead of it.
    #
    # This matters more since the chain invariant moved to `tags`
    # (ADR-tmpoxkk7): any tag can now bind a relation, so an ad-hoc word typed
    # once can quietly assert that two documents share a subject. A closed
    # vocabulary makes that a decision instead of a typo.
    tiny-models:
      label: Tiny models
      blurb: claims that hold at the small end and not in general — sub-billion-parameter training, where the usual scaling advice inverts
  # What a status means for a practice. The five words are luria's and closed;
  # the meanings are this anthology's.
  #
  # The old schema had three (`experimental`, `standard`, `deprecated`) and used
  # one: all 119 recommendations were `standard`, because the two branches that
  # could set the others read a field that no qualifying paper had. A status
  # every record shares is indistinguishable from no status at all — which is
  # what `luria lint` reports as `inert-status`, and why these five are written
  # down rather than assumed.
  sota-statuses:
    Active:
      label: Current practice
      blurb: what you should do today, and the reason is one click away

    Proposed:
      label: Promising
      blurb: early results are good, validation at scale is missing — the old `experimental` flag

    Deferred:
      label: Not yet judged
      blurb: probably right, not yet worth asserting; usually a question of adoption rather than correctness

    Superseded:
      label: Replaced
      blurb: something newer does this better, and the record says what

    Rejected:
      label: Retired
      blurb: no longer believed, with no successor — the attic
  # What a status means for a paper — which is a different question from what
  # it means for a practice, and the reason the two are separate schemes.
  #
  # A paper's status is about its standing in the anthology, not about whether
  # its findings are true. Adam is `Active` here because it is worth reading;
  # whether any particular thing it recommends is still what you should do is
  # the SOTA scheme's business, and the two can disagree.
  lit-statuses:
    Active:
      label: In the anthology
      blurb: worth reading, whether or not a practice was drawn from it

    Proposed:
      label: Watching
      blurb: promising and unproven; the note says what would settle it

    Deferred:
      label: Unreviewed
      blurb: in the corpus, not yet read closely enough to place

    Superseded:
      label: Superseded
      blurb: later work covers this better, and the note names it

    Rejected:
      label: Attic
      blurb: retired with a reason — too narrow, too theoretical, or simply not interesting enough to carry
  # What a status means for a reading — which is not what it means for a paper
  # or for a practice, and is the field this record most needed and did not
  # have (ADR-025).
  #
  # A NOTE's status is a claim about HOW DEEPLY THE PAPER WAS READ, not about
  # whether the paper is any good. That is the LIT scheme's business, and the
  # two are allowed to disagree in every direction: a foundational paper can
  # have a `Skimmed` note, and a paper in the attic can have a `Read` one —
  # reading it carefully is often how it got there.
  #
  # The reason this vocabulary exists at all: LIT-052 and LIT-025 each carried
  # a plausible-looking set of takeaways that turned out not to be about their
  # paper, and eight practices were built on them. Both would have been marked
  # `Unread` under this vocabulary, and nobody would have sourced anything to
  # them.
  #
  # On the distribution: luria's inert-status check reports that every NOTE is
  # `Read`, and it is right to. It is also expected, and by decision rather than
  # by accident (ADR-025).
  #
  # **The absence of a NOTE means the paper is unread.** A note is written when
  # someone finishes a paper, so a LIT with no NOTE is exactly the state the
  # record could not previously express — and it costs nothing to express it
  # that way. The alternative was filing two hundred `Unread` stubs, which is a
  # migration that buys a row in a table.
  #
  # `Unread` stays in the vocabulary for the case absence cannot cover: a
  # deliberate human judgement that a paper was looked at and set aside. "Nobody
  # has got to this yet" is silence; "I opened this and decided not to read it"
  # is a fact worth recording, and it needs somewhere to live.
  #
  # So the check will keep firing while every filed note is a finished reading.
  # That is the honest state of the field and not a defect to engineer around.
  note-statuses:
    Read:
      label: Read
      blurb: the full text, closely enough to state its assumptions and results exactly — the only status that licenses a claims table

    Skimmed:
      label: Skimmed
      blurb: abstract, figures and selected sections; honest, useful, and explicitly not enough to source a practice from

    Unread:
      label: Unread
      blurb: looked at and deliberately set aside — a human judgement, not a backlog entry. A paper nobody has reached simply has no note (ADR-025)

    Superseded:
      label: Re-read
      blurb: a later reading replaced this one, and names it

  # What a status means for an EXPLANATION — a third answer to a question the
  # record has now asked three times, and a different answer again.
  #
  # A THEORY's status says whether this record believes the ACCOUNT. That is
  # independent of whether the thing being explained works, and batch
  # normalization is the case the scheme was built around: the practice is
  # `Active`, the paper is `Active`, and the explanation the paper was
  # published with is `Rejected` — because the experiment that would have
  # confirmed it was eventually run, and came out the other way (LIT-223).
  # Under one scheme there was nowhere to put that third fact.
  theory-statuses:
    Active:
      label: The current account
      blurb: the best explanation the record holds for why this happens

    Proposed:
      label: Offered
      blurb: stated and plausible, on evidence that is suggestive rather than settling — the document says what would settle it

    Deferred:
      label: Not yet judged
      blurb: filed because the question is real; no position taken on the answer

    Rejected:
      label: Disbelieved
      blurb: tested and failed, or contradicted by later work — and the thing it explained may still work perfectly well

    Superseded:
      label: Replaced
      blurb: a later account covers the same ground better, and this one names it

  # Decision tags — display name, blurb, and the order they appear in the index.
  adr-tags:
    record:
      label: The record
      blurb: what the schemes hold, and the rules between them
    taxonomy:
      label: Taxonomy
      blurb: the topic vocabulary and what enforces it
    mechanism:
      label: Mechanism
      blurb: identifiers, generation, the lint
    migration:
      label: Migration
      blurb: moving off the YAML registry, and what happens to it
  # The words this scheme's documents may use, and what each means.
  #
  # `status:` is a controlled vocabulary like any other, and this is
  # the vocabulary: `[luria.schemes.X.fields.status]` in luria.toml is
  # the wiring. Rename these, drop what you do not want, add your own.
  # The one rule is that the scheme's `active` word has to appear here
  # — it is how everything decides what is in force.
  adr-statuses:
    Active:
      blurb: in force — the current answer, and what a citation should normally point at
    Proposed:
      blurb: not in force yet — an open question, so citing it as settled is what the reference report catches
    Deferred:
      blurb: not in force and not being worked on; the question is real and the answer waits on something
    Superseded:
      blurb: no longer in force because something replaced it; the successor is named in the field, not in the prose
    Rejected:
      blurb: no longer in force and nothing replaced it — kept because a rejection is worth being able to point at
  # Principle tags. Shared vocabulary with the decisions where it overlaps.
  dp-tags:
    record:
      label: The record
      blurb: what it holds, and what it refuses to lose
    evidence:
      label: Evidence
      blurb: citations, provenance, and what makes a claim checkable
    craft:
      label: Craft
      blurb: how the machinery is built and kept honest
  # How far the FIELD has converged on a practice — which is not the same
  # question as whether this record endorses it.
  #
  # `status:` is our editorial position. It cannot say "shipped in production at
  # one lab and disputed by two others", and mHC is exactly that: a design in a
  # 1.6T-parameter model, attacked by two independent groups within a month, and
  # `Proposed` here. Three facts, one field, until this file existed (ADR-015).
  #
  # The two axes are genuinely orthogonal, and the useful cases are the corners.
  # `Deferred` + `converged` is a practice everybody follows that we have not
  # satisfied ourselves is deliberate. `Active` + `contested` is this record
  # being ahead of the field and saying so — which is a thing an anthology
  # should be able to do, not a contradiction.
  #
  # `unassessed` is the default and most of the corpus carries it. That is
  # honest rather than lazy: a consensus reading is a judgement about a
  # community, it needs grounds, and a value invented to fill a column is worse
  # than an admission. What the record knows, it says; what it has not looked
  # at, it counts.
  consensus:
    unassessed:
      label: Not judged
      blurb: nobody has assessed where the field stands on this; the default, and true of most of the corpus

    unreplicated:
      label: One source
      blurb: one group, one result — nobody has agreed or disagreed yet, which is not the same as contested, where people looked and differed

    contested:
      label: In dispute
      blurb: credible groups publicly disagree, now — the fork in a line of work, whose trunk is agreed and whose branches are not

    emerging:
      label: Spreading
      blurb: several independent groups, moving toward default without being there

    converged:
      label: Agreed
      blurb: the field agrees and dissent is marginal, whether or not each adopter made the choice deliberately

    universal:
      label: Assumed
      blurb: not doing it is what needs justifying
issue_url: https://github.com/dmarx/anthology-of-the-sota/issues/{n}
paths:
  docs: docs
  decisions: record/decisions.d
  reports: docs/reports
  design_principles: docs/design-principles.md
schemes:
  # ── The product: one document per recommendation ─────────────────────────
  # `requires` is the rule that this anthology is about *justified* practice:
  # a recommendation with no paper behind it is an opinion, and fails the lint
  # until someone supplies the citation.
  SOTA:
    dir: record/practices.d
    output: docs/practices
    active: Active
    render: index
    allocate: merge
    # `source:` holds a LIST of LIT codes, and the relationship is declared
    # rather than merely required (ADR-010). Two things this buys that
    # `requires = ["source"]` could not: the lint checks that every element names
    # a real LIT document rather than any truthy value, and a practice can record
    # all the evidence it rests on instead of one paper. The first entry is the
    # primary source; the rest corroborate. Without `many` a list would be
    # stringified and only its first code checked.
    #
    # `extends:` and `compared_against:` are the same two relations the literature
    # carries (ADR-011), at the practice layer. A practice line and a paper line
    # are not the same shape: papers fork where the *designs* differ, practices
    # fork where the *recommendations* do, and a fork can exist at one level and
    # not the other. Declared so the fork this record already argues about — a
    # widened residual stream, mixed how? — is structure rather than paragraphs.
    references:
      source:
        scheme: LIT
        required: true
        many: true
      # The other half of the cut DP-005 made (ADR-tmpqczy4). That principle
      # separated ADOPTION from evidence and sent adoption to `consensus:`.
      # This separates ORIGIN from evidence: `source:` is the work that
      # produced evidence ABOUT the claim, and `introduced_by:` is the work
      # that first stated the recommendation. They are frequently not the same
      # paper, and ADR-017's retraction test picks the former by construction
      # — so with one field the record reads as though every practice began
      # with the paper it cites.
      introduced_by:
        scheme: LIT
        required: true
        many: true
      # The converse of `THEORY.explains` (ADR-tmpvv7zp). A practice does not
      # have to have an explanation and most do not; what this buys is that
      # where the record HAS one, the practice says so from its own page
      # instead of the connection being legible only from the theory side.
      # Written by `luria link --fix`, like every other converse.
      explained_by:
        scheme: THEORY
        required: false
        many: true
        converse: explains
      extends:
        scheme: SOTA
        required: false
        many: true
        converse: extended_by
      extended_by:
        scheme: SOTA
        required: false
        many: true
        converse: extends
      # A comparison is one fact, and its converse is itself — which is what makes
      # it symmetric. Declaring that is what lets `luria link --fix` write the
      # other side, so a comparison is stated once on whichever practice ran it
      # rather than on every member of the family (LU-ADR-tmphedn4).
      compared_against:
        scheme: SOTA
        required: false
        many: true
        converse: compared_against
      # The same sign at the practice layer (ADR-017). A recommendation that exists
      # because its predecessor breaks — QK-Clip under Muon, mHC under
      # hyper-connections — is a different step from one that refines a predecessor
      # that works.
      corrects:
        scheme: SOTA
        required: false
        many: true
        converse: corrected_by
      corrected_by:
        scheme: SOTA
        required: false
        many: true
        converse: corrects
      # The evidence AGAINST, required exactly where the record claims there is
      # some. `consensus: contested` asserts that specific other work exists —
      # "credible groups publicly disagree" is a claim about documents — and it is
      # the only value on the axis that does: `unassessed` and `converged` name
      # nobody. So it is held to the same standard as `source:`, which is the
      # evidence for (ADR-016).
      #
      # `scheme = "LIT"`, not SOTA: what contests a recommendation is a paper, and
      # both cases in the record are papers. No `converse`, and that is now a
      # choice rather than a limit — luria has allowed a crossing converse since
      # LU-ADR-097, and `explained_by:` above is one. It is left undeclared
      # because the far side would be a list of practices on a NOTE, and a
      # note is a paper's standing rather than a docket of what it undercuts.
      contested_by:
        scheme: LIT
        required: false
        many: true
        required_when:
          consensus:
          - contested
    fields:
      # A provisional practice must say what would settle it (ADR-014). Required
      # only at the statuses where something is actually pending: an Active
      # practice has nothing to be waiting for, and a Superseded one's successor
      # already answers the question. The condition is prose on purpose — a
      # machine-checkable one would have to be a COUNT of evidence, and counting
      # is the error that produced the decision.
      promote_when:
        required_when:
          status:
          - Proposed
          - Deferred
      # Lineage between practices, the same two relations the literature carries
      # (ADR-011). A practice line and a paper line are not the same shape: the
      # papers fork where the *designs* differ, the practices fork where the
      # *recommendations* do, and a fork can exist at one level and not the other.
      # Declared here so the fork the record already argues about — a widened
      # residual stream, mixed how? — is structure rather than three paragraphs.
      # What the FIELD thinks, as distinct from what this record asserts
      # (ADR-015). `status:` is our editorial position and cannot express "shipped
      # in production at one lab, disputed by two others". A second axis can, and
      # the two are orthogonal — a `Deferred` practice can be `converged` and an
      # `Active` one `contested`. Defaulted rather than required: a consensus
      # reading needs grounds, and most of the corpus honestly has none.
      consensus:
        vocabulary: consensus
        default: unassessed
      # The primary topic, named rather than merely constrained. The tag group
      # below guarantees that exactly one tag comes from the vocabulary; this says
      # WHICH tag that is, by reading the first one. Two things follow that the
      # group alone could not give: the topic can be compared across documents (the
      # chains' `invariant` below), and it can be read as a value rather than
      # inferred by intersecting a list against a vocabulary.
      #
      # Derived, so it is stored nowhere and cannot drift: retagging a practice
      # retags its primary topic in the same edit. The cost is a convention nothing
      # checks — the primary tag must be listed FIRST — which holds in all 188
      # practices and all 218 notes today and is a silent error the day it does
      # not. LU-#229 asks luria for the guard.
      primary_topic:
        derive: '{tags[0]}'
      # The publication date of the work this rests on, read from the paper rather
      # than copied onto the practice (#119, LU-ADR-088).
      #
      # `source[0]` is the PRIMARY source: ADR-010 makes the list ordered and
      # ADR-017 makes the first entry the one that would force a rewrite if it were
      # retracted. That was already the convention -- 175 of the 183 practices that
      # carried the field by hand used exactly this -- but it was never written
      # down, so eight practices drifted to the date of a source they no longer
      # cited. Nothing could see it: concretize rewrites references, not values.
      published:
        derive: '{published}'
        from: source[0]
      # `status:` declared as the controlled vocabulary it is (#181),
      # written by `luria upgrade statuses`.
      status:
        vocabulary: sota-statuses
      tags:
        vocabulary: topics
        many: true
        required: true
        # Closed (ADR-tmpoxkk7): since the chain invariant reads `tags`, an
        # undeclared word can bind a relation, so a tag typed once would
        # quietly assert that two documents share a subject. Closing it makes
        # every tag one the vocabulary above names. NOTE's `tags:` declares no
        # vocabulary at all and is not covered — see the decision.
        closed: true
        groups:
          # The topic consolidation, enforced. Thirteen topics, exactly one primary
          # per practice; secondary tags are unconstrained. The vocabulary and the
          # one-primary rule both come from ADR-003, which promoted them out of the
          # Jinja template they had been sitting in, unapplied, since 2024.
          primary_topic:
            # `any`, not `exactly-one` (ADR-tmpoxkk7). A document is often about
            # two of the thirteen -- a positional-encoding scheme is also an
            # attention technique, a context-extension paper is both -- and under
            # `exactly-one` recording the second meant deleting the first. The
            # primary topic is still exactly one thing: `primary_topic` derives
            # `{tags[0]}`, so the FIRST topic listed is the primary and every
            # chain invariant still compares one value against one value.
            #
            # The cost is that `tags[0]` becomes load-bearing where it was only
            # conventional. It already was -- a free-form tag listed first would
            # always have made `primary_topic` wrong -- and holds in all 596
            # documents today, but a reordering is now a silent retag. LU-#229
            # asks luria for the guard.
            require: any
            # Thirteen, and the same thirteen the LIT scheme has. ADR-027 added
            # `analysis-and-evaluation`; ADR-026 then added `generative-modeling` and
            # `vision-and-graphics`, superseding ADR-020, whose rejection of exactly that
            # had started being cited as a scope boundary — the thing ADR-020 existed to
            # remove. The filing rule is unchanged and is the point: take a domain topic
            # when the claim is ABOUT the domain; a claim merely discovered in one still
            # takes its kind.
            #
            # ADR-026: the practice vocabulary is now the same thirteen the
            # reading list has. The two schemes differ in what a document IS, not
            # in what it may be ABOUT.
            tags:
            - training-optimization
            - systems-optimization
            - model-stability
            - distributed-optimization
            - data-pipeline
            - attention-techniques
            - model-architecture
            - inference-optimization
            - adaptation-and-tuning
            - representation-and-encoding
            - analysis-and-evaluation
            - generative-modeling
            - vision-and-graphics
    axis: tags
  # ── The explanation: one document per claim about why something works ────
  # A practice is an instruction; a theory is a finding. They were one scheme
  # until ADR-tmpvv7zp, and the seam showed from both sides: six practices
  # whose titles state a behaviour rather than an instruction ("larger models
  # are more sample efficient"), and forty-eight papers that no practice
  # cites — two of which say in their own bodies that they carry no practice
  # DELIBERATELY, because what they found is not advice.
  #
  # The relationship to LIT is exactly the one SOTA has, for exactly the
  # reason ADR-002 gives: a note is a PAPER'S STANDING, a claim is a CLAIM,
  # and a claim outlives the paper that made it and can be contested by
  # papers that had nothing to do with it.
  THEORY:
    dir: record/theory.d
    output: docs/theory
    active: Active
    render: index
    allocate: merge
    references:
      # The same rule as a practice, for the same reason: an explanation with
      # no paper behind it is a hunch.
      source:
        scheme: LIT
        required: true
        many: true
      # The point of the scheme — the link the record could not previously
      # draw, and the one the practice registry reads back as `explained_by:`.
      #
      # OPTIONAL, and the seed set is why: the two lottery-ticket documents
      # explain no practice, because the record holds no pruning recommendation
      # for them to explain. A finding that underwrites nothing YET is still a
      # finding, and requiring this would mean filing it nowhere — which is
      # the state this scheme exists to end.
      explains:
        scheme: SOTA
        required: false
        many: true
        converse: explained_by
      # Lineage between explanations, and the distinction is the one the other
      # two schemes draw (ADR-017): `extends` refines an account that holds,
      # `corrects` exists because an account BREAKS. Both edges in the seed set
      # are corrections, which is what an explanation's life mostly consists of.
      #
      # No `compared_against:` yet. It is declared on SOTA and LIT because
      # documents there state comparisons; nothing here does, and a relation
      # nobody writes is a converse the fixer can never complete.
      extends:
        scheme: THEORY
        required: false
        many: true
        converse: extended_by
      extended_by:
        scheme: THEORY
        required: false
        many: true
        converse: extends
      corrects:
        scheme: THEORY
        required: false
        many: true
        converse: corrected_by
      corrected_by:
        scheme: THEORY
        required: false
        many: true
        converse: corrects
    fields:
      # The same rule as the practice registry's (ADR-014), and if anything a
      # sharper one here: what distinguishes an explanation from a story is
      # being able to say what would show it wrong.
      promote_when:
        required_when:
          status:
          - Proposed
          - Deferred
      status:
        vocabulary: theory-statuses
      primary_topic:
        derive: '{tags[0]}'
      # Read from the paper, like everywhere else (#119, LU-ADR-088). An
      # explanation is dated by the work that first published it, which is
      # `source[0]` by the same ordering rule ADR-010 gives the practices.
      published:
        derive: '{published}'
        from: source[0]
      # The same thirteen, for the reason ADR-026 gives: the schemes differ in
      # what a document IS, not in what it may be ABOUT. A third scheme with a
      # fourth copy of the list is how the glosses drifted the last time; the
      # WORDS are one table in `vocabularies.topics` and only the rule is here.
      tags:
        vocabulary: topics
        many: true
        required: true
        # Closed (ADR-tmpoxkk7): since the chain invariant reads `tags`, an
        # undeclared word can bind a relation, so a tag typed once would
        # quietly assert that two documents share a subject. Closing it makes
        # every tag one the vocabulary above names. NOTE's `tags:` declares no
        # vocabulary at all and is not covered — see the decision.
        closed: true
        groups:
          primary_topic:
            # `any`, not `exactly-one` (ADR-tmpoxkk7). A document is often about
            # two of the thirteen -- a positional-encoding scheme is also an
            # attention technique, a context-extension paper is both -- and under
            # `exactly-one` recording the second meant deleting the first. The
            # primary topic is still exactly one thing: `primary_topic` derives
            # `{tags[0]}`, so the FIRST topic listed is the primary and every
            # chain invariant still compares one value against one value.
            #
            # The cost is that `tags[0]` becomes load-bearing where it was only
            # conventional. It already was -- a free-form tag listed first would
            # always have made `primary_topic` wrong -- and holds in all 596
            # documents today, but a reordering is now a silent retag. LU-#229
            # asks luria for the guard.
            require: any
            tags:
            - training-optimization
            - systems-optimization
            - model-stability
            - distributed-optimization
            - data-pipeline
            - attention-techniques
            - model-architecture
            - inference-optimization
            - adaptation-and-tuning
            - representation-and-encoding
            - analysis-and-evaluation
            - generative-modeling
            - vision-and-graphics
    axis: tags
  # ── The evidence: one note per paper ─────────────────────────────────────
  LIT:
    dir: record/literature.d
    output: docs/literature
    active: Active
    render: index
    allocate: merge
    # The identifier this anthology gave up, given back as a second spelling.
    # Before the migration a note's id was `MLR-2014-Kingma001-0001` — prefix,
    # year, first author, sequence — and readable without a lookup; it became
    # `LIT-001`. Numeric codes were the right trade (a code that encodes a fact
    # rots when the fact is corrected), but the readability did not have to go
    # with it. An alias is RECOMPUTED from the frontmatter on every read, so it
    # is always true, and `LIT-Kingma-2014-001` resolves wherever `LIT-001` does
    # (LU-ADR-088).
    #
    # `{published:.4}` truncates the date string to its year — no filter, just
    # the format spec `str.format` already has. `{number:03d}` pads to match the
    # code's own spelling, so the two ids read as the same document rather than
    # two conventions. Every one of the 218 notes renders one and no two collide.
    alias: LIT-{first_author}-{published:.4}-{number:03d}
    field_groups:
      # Every note names a SOURCE, and a source is any of several things: an arXiv
      # identifier, a DOI, or failing both a URL. `requires = ["arxiv"]` demanded
      # the wrong thing of a report that was never posted there, and the first
      # such report to arrive (a technical blogpost) could not be filed at all.
      # The group names the need and the fields that satisfy it, and the lint asks
      # for one (ADR-009). Prefer the fields in the order listed: an `arxiv:` or
      # `doi:` resolves through a remote below; a `url:` is a string.
      source:
        fields:
        - arxiv
        - doi
        - url
        require: at-least-one
    # Lineage, as fields rather than a paragraph repeated in every note
    # (ADR-011). `extends:` is the spine of a line — this work builds on that
    # one — and is directed. `compared_against:` is the cross-link that turns a
    # set of rivals into a comparison, and it names ITSELF as its converse,
    # which is what symmetry is: the fact is one fact, so a one-sided
    # declaration is a finding and `luria link --fix` writes the other side
    # (LU-ADR-tmphedn4). A later paper cannot have been made to declare a
    # comparison against work that did not exist yet, so the author states it
    # once, on the note that ran the comparison.
    #
    # `extends:` declares `extended_by:` as its converse, so the fork in a line
    # is legible from the TRUNK and not only from the branches. LIT-140 saying
    # `extended_by: [LIT-151, LIT-181]` is the branched-conflict shape this
    # record argues about, readable without opening four other notes or the
    # chain page. Storing it is redundant with the forward declaration, which is
    # the cost; the fixer keeps the two in agreement in both directions,
    # including when a relation is withdrawn.
    #
    # Neither relation is `superseded_by:`: two live designs in different
    # production models are not a retirement.
    references:
      extends:
        scheme: LIT
        required: false
        many: true
        converse: extended_by
      extended_by:
        scheme: LIT
        required: false
        many: true
        converse: extends
      compared_against:
        scheme: LIT
        required: false
        many: true
        converse: compared_against
      # Corrective succession (ADR-017). `extends:` says a work builds on its
      # parent; `corrects:` says it exists because the parent is broken, and the
      # test is the child's own text — does it name a defect in the parent as its
      # motivation. Both are the spine of one line, so the chain below walks them
      # together (LU-#211); the sign is which field the code sits in, which is what
      # keeps it an edge property without qualifying a reference (ADR-011).
      corrects:
        scheme: LIT
        required: false
        many: true
        converse: corrected_by
      corrected_by:
        scheme: LIT
        required: false
        many: true
        converse: corrects
    fields:
      # The publication date, and the one place it lives. A LIT note is about a
      # paper, so the paper's date is this scheme's fact; SOTA and NOTE read it
      # from here rather than carrying a copy (LU-ADR-088, #119).
      #
      # Declared rather than left to convention because a followed template checks
      # its names against the target scheme: undeclared, `{published}` would
      # resolve to nothing on every practice and read like a record with no
      # findings. It also feeds this scheme's `alias` template above.
      published:
        required: true
      # The same derivation on the reading list, over the wider vocabulary below.
      primary_topic:
        derive: '{tags[0]}'
      status:
        vocabulary: lit-statuses
      tags:
        vocabulary: topics
        many: true
        required: true
        # Closed (ADR-tmpoxkk7): since the chain invariant reads `tags`, an
        # undeclared word can bind a relation, so a tag typed once would
        # quietly assert that two documents share a subject. Closing it makes
        # every tag one the vocabulary above names. NOTE's `tags:` declares no
        # vocabulary at all and is not covered — see the decision.
        closed: true
        groups:
          # The same thirteen as the practice registry above, since ADR-026. ADR-003
          # gave LIT five topics the SOTA scheme lacked, on the ground that the corpus
          # carries generative-vision, theory and inference work that produced no training
          # recommendation; four decisions have since closed that gap one topic at a time,
          # and the schemes now differ in what a document IS rather than in what it may be
          # ABOUT. Kept as a separate declaration because they are separate schemes and a
          # future decision may separate them again.
          primary_topic:
            # `any`, not `exactly-one` (ADR-tmpoxkk7). A document is often about
            # two of the thirteen -- a positional-encoding scheme is also an
            # attention technique, a context-extension paper is both -- and under
            # `exactly-one` recording the second meant deleting the first. The
            # primary topic is still exactly one thing: `primary_topic` derives
            # `{tags[0]}`, so the FIRST topic listed is the primary and every
            # chain invariant still compares one value against one value.
            #
            # The cost is that `tags[0]` becomes load-bearing where it was only
            # conventional. It already was -- a free-form tag listed first would
            # always have made `primary_topic` wrong -- and holds in all 596
            # documents today, but a reordering is now a silent retag. LU-#229
            # asks luria for the guard.
            require: any
            tags:
            - training-optimization
            - systems-optimization
            - model-stability
            - distributed-optimization
            - data-pipeline
            - attention-techniques
            - model-architecture
            - generative-modeling
            - vision-and-graphics
            - adaptation-and-tuning
            - inference-optimization
            - analysis-and-evaluation
            - representation-and-encoding
    axis: tags
  # ── The reading: one document per paper someone actually opened ──────────
  # A LIT note says what a paper's STANDING is here. It never said what the
  # paper CONTAINS, and the corpus holds two demonstrations of the cost:
  # LIT-052's six takeaways were about a different paper entirely, and
  # LIT-025's four were in the right neighbourhood and backwards about the
  # finding. Eight practices rested on them. Both notes passed every
  # mechanical check there is (#113) — only reading catches this, and the
  # record had nowhere to put a reading. See ADR-tmp2q9cv.
  NOTE:
    dir: record/notes.d
    output: docs/notes
    # `active = "Read"` and not "Active": this scheme's statuses say how deeply
    # the paper was read, so the in-force value is the one that means someone
    # finished it. A `Skimmed` note is a real document and deliberately not in
    # force — a practice sourced to a paper whose only reading is a skim is a
    # finding, and this is what makes the lint able to say so.
    active: Read
    render: index
    allocate: merge
    # Every NOTE is `Read`, and that is the decision rather than an oversight
    # (ADR-025). A note is written when someone finishes a paper, so the ABSENCE
    # of a note is how this record says "unread" — which costs nothing and means
    # the 200-odd papers nobody has read are legible by not having one. `Unread`
    # stays in the vocabulary for what absence cannot express: a deliberate
    # judgement that a paper was looked at and set aside.
    uniform_ok: absence of a NOTE means unread (ADR-025), so every filed note is a finished reading; `Unread` is reserved for a paper deliberately set aside
    # The bibliography lives on the LIT and is not repeated here. This record
    # has already paid for a fact stored twice — LIT-115's wrong author reached
    # six sites because four practices had rendered it into prose (#113) — so a
    # NOTE carries the code and nothing else of the sort.
    #
    # `required = true` is the whole point of the scheme: a reading is a reading
    # OF something. There is no converse on the LIT side, because Luria's
    # converse must be same-scheme and this crosses.
    #
    # It carries the TOPICS too, below: a note and its paper are the same
    # object, so the note holds no subject of its own (ADR-tmpvv2d8).
    references:
      paper:
        scheme: LIT
        required: true
        many: false
    fields:
      status:
        vocabulary: note-statuses
      # A reading is about one paper, so its date is that paper's (#119).
      published:
        derive: '{published}'
        from: paper
      # A reading is filed under nothing of its own. Both of these read the
      # paper's frontmatter, because a note and its paper ARE the same paper
      # and a second copy of its subject is a second copy free to disagree --
      # which is what four of them were doing (ADR-tmpvv2d8). Deriving is the
      # answer the invariant was a weaker version of: it cannot disagree
      # rather than reporting when it does.
      #
      # `many` says this holds the paper's whole list rather than one value of
      # it. Both halves are checked against LIT, and the check exists because
      # omitting `many` used to be silent -- the value resolved as a list
      # against a contract saying one, which reads as NO values, and every
      # `docs/notes/tags/*.md` page stopped being written (LU-#276).
      #
      # `from: paper` on BOTH, not `{tags[0]}` off this document's own derived
      # `tags`: derivations do not chain -- one hop, reading written
      # frontmatter -- so a primary derived from a derived list would resolve
      # to nothing on every note.
      primary_topic:
        derive: '{tags[0]}'
        from: paper
      tags:
        derive: '{tags}'
        from: paper
        many: true
    axis: tags
  # ── This project reasoning about itself ──────────────────────────────────
  ADR:
    dir: record/decisions.d
    output: docs/decisions
    active: Active
    render: index
    allocate: merge
    fields:
      status:
        vocabulary: adr-statuses
      tags:
        vocabulary: adr-tags
        many: true
        required: true
        closed: false
    axis: tags
  DP:
    dir: record/principles.d
    output: docs/design-principles.md
    active: Active
    render: document
    allocate: merge
    # A principle that names AdamW is a claim about AdamW, not a principle. The
    # terms it must avoid are in [luria.lint] below.
    titles_generalize: true
    fields:
      status:
        vocabulary: adr-statuses
      tags:
        vocabulary: dp-tags
        many: true
        required: true
        closed: false
    axis: tags
remotes:
  # ── arXiv as a remote ────────────────────────────────────────────────────
  # Not a Luria record — a `uid` remote, whose references are the prefix plus
  # whatever the pattern matches. Writing `ARXIV-1412.6980` anywhere in the
  # record makes it a resolvable, checkable citation instead of a bare string
  # in a YAML field that nothing could follow.
  ARXIV:
    name: arXiv
    uid: (\d{4})[.:](\d{4,5})(v\d+)?
    url: https://arxiv.org/abs/{1}.{2}
    uris:
      # Where to ask what this identifier actually is, and how to read the answer
      # (LU-#166). `luria remotes --resolve` fetches it; `luria lint` compares the
      # recorded title offline against what was recorded here.
      title: https://export.arxiv.org/api/query?id_list={1}.{2}
    title_re: <entry>.*?<title>(.*?)</title>
  # DOIs the same way (ADR-009). The delimiter moves out of the way of the
  # dots and slash a DOI carries: `DOI:10.1145/3600006.3613165`.
  DOI:
    name: DOI
    uid: 10\.\d{4,9}/[^\s\]\)>,;]+
    delim: ':'
    url: https://doi.org/{uid}
  LU:
    name: luria
    repo: dmarx/luria
    ref: main
    dir: record/decisions.d
    schemes:
      DP:
        document: docs/design-principles.md
  # Fixture codes: `FX-ADR-049` in a template or an example resolves to the note
  # explaining the convention, and can never collide with this record's own
  # numbering. The scheme templates copied from luria cite these.
  FX:
    name: fixtures
    url: https://github.com/dmarx/luria/blob/main/docs/directives.md#fixture-codes
# ── Churn gets a narrative ───────────────────────────────────────────────
# Five consecutive commits called "Update ML training registry" are what a
# living document looks like when nothing records *why* it moved.
fragments:
  record/changelog.d:
    file: CHANGELOG.md
    style: changelog
journals:
  curation:
    dir: record/curation.d
    output: docs/curation
    granularity: month
    title: Curation log
    blurb: Why things entered the anthology, and why they left.
code:
  globs:
  - src/**/*.py
  # README.md used to be assembled from templates under docs/readme/, which
  # were scanned instead of the rendered result so one reference was not
  # reported twice. The templates are gone and README.md is an ordinary file
  # now, but it stays `historical`: it is prose about the project rather than a
  # claim the record has to keep current.
  historical:
  - CHANGELOG.md
  - README.md
# title, base_url and source_url all derive from issue_url.
site:
  icon: assets/logo.svg
# Warn-first. The checks that matter here — `inert-status`, which would have
# caught 119/119 recommendations sitting at one status, and
# `unresolved-codes`, which would have caught the attic pointing at papers
# not in the corpus — are reported on every run and promoted to failures in
# phase 4, once the backlog they surface has been worked through.
lint:
  # The enforcement dial (LU-ADR-035). Empty since the record was built, which
  # meant every check was advice. `source-mismatch` is not advice: it is the
  # only check that verifies a document is about the paper it names, it reads
  # the committed lockfile so it costs no network, and it is the check that
  # would have failed the import in #138 -- which filed three readings against
  # identifiers belonging to other papers while the lint printed a clean run.
  #
  # It is at zero today, which is the precondition for promoting anything: a
  # dial turned on over existing findings fails the next contributor for
  # somebody else's backlog.
  #
  # `source-unchecked` is deliberately NOT here. It fires when nothing has
  # verified an identifier AND upstream could not be reached, so promoting it
  # would convert an arXiv outage into a red build for a contribution that did
  # nothing wrong. A check whose failure a contributor cannot act on teaches
  # people to ignore the dial, which costs more than the case it catches.
  #
  # What neither check reaches: two documents claiming ONE identifier, which is
  # the defect #138 actually shipped -- 67 duplicate notes, correct titles,
  # correct identifiers, green lint. LU-#165 is that finding upstream, and asks
  # for a `luria merge` to resolve one once found.
  fail_on:
  - source-mismatch
  # `inert-status` is a judgement this project has heard and does not want
  # repeated: the NOTE scheme is uniform by design (ADR-025) and `uniform_ok`
  # below already carries the reason. Muting is the global form of the same
  # answer — the finding is not useful here, and a line nobody acts on costs
  # the report its credibility.
  mute:
  - inert-status
  - acknowledged-uniformity
  narrow_terms:
  - adam
  - adamw
  - batchnorm
  - layernorm
  - transformer
  - llama2
  - flash-attention
  - arxiv
  - registry
chains:
  # ── The lines of work ────────────────────────────────────────────────────
  # The sequences are the most valuable thing in this record and existed only
  # as prose, re-described in every participating note, which is how two notes
  # came to claim on the same day that a comparison did not exist. Walked from
  # the fields above and rendered once (ADR-011). Order, title and status
  # only: each note keeps explaining its own step.
  # The practice line, walked from the fields above. Separate from the paper
  # line because they answer different questions: what did this *paper* build
  # on, versus what does this *recommendation* replace.
  # `invariant = "tags"` asks what every relation here already asserts: two
  # practices joined by succession or rivalry are about the same thing, and a
  # topic in common is what says so. Where none survives the relation, the
  # usual reading is that the vocabulary is short a word rather than that the
  # relation is wrong (luria#214) — which is how ADR-021 found its third topic,
  # by hand, before the check existed.
  practice:
    scheme: SOTA
    relation:
    - extends
    - corrects
    sibling: compared_against
    # `tags`, not `primary_topic` (ADR-tmpoxkk7). What a relation asserts is
    # that its members have something in common; it does not assert that the
    # something is the FIRST thing each of them is about. A practice whose
    # primary topic is stability and whose secondary is the attention technique
    # it fixes shares a subject with its counterpart, and the record should be
    # able to say so.
    #
    # It read `primary_topic` for a while on the argument that "any shared tag
    # is too weak to carry it -- two practices bound by an incidental label read
    # as bound when nothing about their subject matter is". That was correct
    # while `exactly-one` was in force, because a secondary was then necessarily
    # a free-form label rather than one of the thirteen. Under `require: any` a
    # secondary can be a real topic, and the objection survives only for the
    # free-form ones.
    #
    # Measured on the switch: three edges bind. LIT-211/LIT-229 and
    # LIT-211/LIT-242 bind on `training-optimization` and should -- all three
    # are about evolution strategies as an optimizer. SOTA-085/SOTA-161 bound on
    # a `flash-attention` label that #101 added for exactly this purpose, which
    # is the case the old argument was about; both tags are removed and the edge
    # is open again. `tiny-models` is the only free-form tag left, on ten
    # documents, and it binds nothing today.
    invariant: tags
    output: docs/practice-lines.md
    title: Lines of practice
    # Show consensus beside status, which is the whole reason both axes exist:
    # without it the page renders an agreed trunk and a disputed fork the same.
    facet_by:
    - status
    - consensus
  # Declared on the reading list too, where it reports more: every note carries
  # exactly one topic and none carries a secondary, so an unbound line is the
  # ordinary state of a lineage that crosses a fault line in the vocabulary —
  # the RoPE papers filed under two topics, Mamba under two, GShard apart from
  # the MoE papers it shards. Those are the findings, and they are #85's to
  # read, not this declaration's to pre-empt.
  lineage:
    scheme: LIT
    relation:
    - extends
    - corrects
    sibling: compared_against
    # The same assertion here and for the same reason, which is why both chains
    # name the same field. Notes carry a secondary topic now -- the eight
    # positional-encoding papers do -- so this reports strictly less than it did
    # under `primary_topic`, and what it stops reporting is lines whose members
    # really do share a subject.
    invariant: tags
    output: docs/lineage.md
    title: Lines of work
