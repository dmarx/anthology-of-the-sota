name: Generate Directory Summaries

# This job commits and pushes (llamero's default), so two dispatches racing
# would each rebase a summary commit onto the other's and conflict on the
# files both wrote. Dispatch-only makes that unlikely and not impossible,
# which is the reasoning ADR-tmpepag3 exists to distrust.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  #push:
  workflow_dispatch:

jobs:
  generate-summaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install llamero
      run: pip install llamero

    - name: Generate summaries
      run: llamero summarize all
