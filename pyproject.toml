# The anthology is a Luria record, not a Python project. What remains here is
# one script — the migration that produced `record/` from the frozen YAML in
# `data/`, kept re-runnable by ADR-008 — and the packaging metadata it needs
# to be importable.
#
# Everything else that used to live here was removed with issue #41: a local
# README generator superseded by templates and then by nothing, a directory
# summariser, a package-lock helper, and the test suite that covered them.
[project]
name = "scripts"
version = "0.1.0"
description = "The frozen migration that produced this record from its pre-luria YAML."
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]
